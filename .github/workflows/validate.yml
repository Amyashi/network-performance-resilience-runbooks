name: Build and validate public release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-validate:
    name: Build and validate all editions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tools scripts

      - name: Build all PDFs and accessible companions
        run: |
          python src/build_guide.py
          python src/build_macos_guide.py
          python src/build_accessible_guides.py
          python scripts/update_checksums.py

      - name: Verify committed artifacts are current
        run: >-
          git diff --exit-code --
          outputs/
          docs/WINDOWS_11_PRO_ACCESSIBLE_GUIDE.md
          docs/WINDOWS_11_HOME_ACCESSIBLE_GUIDE.md
          docs/MACOS_APPLE_SILICON_ACCESSIBLE_GUIDE.md

      - name: Run PDF-specific checks
        run: python tools/qa_pdfs.py

      - name: Run public-release checks
        run: python scripts/validate_public_release.py

      - name: Check patch whitespace
        run: git diff --check
